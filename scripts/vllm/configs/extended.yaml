# 1k 1k mc1
- benchmark: serving
  model:
    CohereLabs/command-a-plus-05-2026-bf16
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  env:
    VLLM_ROCM_USE_AITER: 1

- benchmark: serving
  model:
    CohereLabs/c4ai-command-r7b-12-2024
  tp: 1
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  env:
    VLLM_ROCM_USE_AITER: 1

## For LLama, Mixtral, etc. on gfx942, use float16 for better GEMM perf
- benchmark: serving
  model:
    meta-llama/Llama-3.1-8B-Instruct
    amd/Llama-3.1-8B-Instruct-FP8-KV
  tp: 1
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  env:
    VLLM_ROCM_USE_AITER: 1
  arch_overrides:
    gfx942:
      dtype: float16

- benchmark: serving
  model:
    mistralai/Mixtral-8x7B-Instruct-v0.1
    amd/Mixtral-8x7B-Instruct-v0.1-FP8-KV
  tp: 1
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
