# Keep Qwen in bf16 on gfx942; Qwen 3.5 exceeds fp16 boundaries and breaks accuracy
- benchmark: serving
  model:
    Qwen/Qwen3.5-397B-A17B-FP8
    amd/Qwen3.5-397B-A17B-MXFP4
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  env:
    VLLM_ROCM_USE_AITER: 1
  extra_args:
    --enable-expert-parallel: True

