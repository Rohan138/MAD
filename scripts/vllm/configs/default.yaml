## Full K3 (~1.56 TB) fits 8x MI325X but not 8x MI300X
- benchmark: serving
  model:
    moonshotai/Kimi-K3
    amd/Kimi-K3-Quark-MXFP4-AttnFP8
  tp: 8
  inp: 1024
  out: 1024
  max_concurrency: 1 8 32 128
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_ROCM_USE_AITER_MOE_SITUV2_A8W4: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
  extra_args:
    --reasoning-parser: kimi_k3
    # text-only benchmark; skips loading MoonViT and frees VRAM for KV cache
    --language-model-only: true
  bench_args:
    # gsm8k runs over /v1/completions, where the always-on reasoning is inline and
    # exhausts the hardcoded max_gen_toks=2048 budget, so the score is meaningless
    --run_accuracy: False

## For LLama, Mixtral, etc. on gfx942, use float16 for better GEMM perf
- benchmark: serving
  model:
    meta-llama/Llama-3.1-405B-Instruct
    amd/Llama-3.1-405B-Instruct-FP8-KV
    amd/Llama-3.1-405B-Instruct-MXFP4-Preview
    meta-llama/Llama-3.3-70B-Instruct
    amd/Llama-3.3-70B-Instruct-FP8-KV
    amd/Llama-3.3-70B-Instruct-MXFP4-Preview
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128
  env:
    VLLM_ROCM_USE_AITER: 1
  arch_overrides:
    gfx942:
      dtype: float16

- benchmark: serving
  model:
    MiniMaxAI/MiniMax-M3-MXFP8
    amd/MiniMax-M3-MXFP4
  tp: 4 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
    VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: 1
  extra_args:
    --block-size: 128
    --kv-cache-dtype: fp8
    --attention-backend: TRITON_ATTN
  arch_overrides:
    # No native MXFP8 MOE for MI300, can't fit bf16 dequant in TP4
    gfx942:
      tp: 8

