# 1k 1k mc1 mc8 mc32 mc128

- benchmark: serving
  model: deepseek-ai/DeepSeek-R1-0528 amd/DeepSeek-R1-0528-MXFP4
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128
  env:
    VLLM_ROCM_USE_AITER: 1

- benchmark: serving
  model:
    deepseek-ai/DeepSeek-V3.2
    amd/DeepSeek-V3.2-MXFP4
    zai-org/GLM-5.3
    amd/GLM-5.3-Quark-MXFP4-AttnFP8
  tp: 4 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
  extra_args:
    # GLM 5.3 has a context window of 1M tokens, which OOMs with bf16 KV cache
    --max-model-len: 101372
    --kv-cache-dtype: fp8
  arch_overrides:
    # MI300 cannot fit FP8 TP4, override to TP8 only
    gfx942:
      tp: 8

- benchmark: serving
  model:
    deepseek-ai/DeepSeek-V4-Flash
    amd/DeepSeek-V4-Flash-MXFP4
    deepseek-ai/DeepSeek-V4-Pro
    amd/DeepSeek-V4-Pro-MXFP4
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
  extra_args:
    --kv-cache-dtype: fp8

